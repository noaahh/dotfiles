name: Chezmoi CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'dot_zsh.d'

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)"

      - name: Initialize and Apply
        env:
          CI: "true"
        run: |
          mkdir -p ~/.local/bin
          mv bin/chezmoi ~/.local/bin/
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --apply --source $GITHUB_WORKSPACE

      - name: Test Idempotency
        env:
          CI: "true"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi apply --source $GITHUB_WORKSPACE

      - name: Verify Dotfiles Applied
        run: |
          echo "Checking core dotfiles..."
          test -f ~/.zshrc && echo "✓ .zshrc exists"
          test -f ~/.gitconfig && echo "✓ .gitconfig exists"
          test -d ~/.config/nvim && echo "✓ nvim config exists"
          test -d ~/.ssh && echo "✓ .ssh directory exists"

      - name: Verify Shell Configuration
        run: |
          echo "Checking zsh configuration modules..."
          test -d ~/.zsh.d && echo "✓ .zsh.d directory exists"
          echo "Contents of ~/.zsh.d:"
          ls -la ~/.zsh.d/ || true

  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)"

      - name: Validate Chezmoi Syntax
        env:
          CI: "true"
        run: |
          mkdir -p ~/.local/bin
          mv bin/chezmoi ~/.local/bin/
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi verify --source $GITHUB_WORKSPACE --verbose

      - name: Validate Template Syntax
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Check for any .tmpl files
          if find . -name "*.tmpl" -type f | grep -q .; then
            echo "Found template files:"
            find . -name "*.tmpl" -type f
            echo "Templates will be validated during chezmoi verify"
          fi
