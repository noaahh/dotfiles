# vim:ft=kitty

## name: Flexoki High Contrast (Light)
## author: Kepano
## license: MIT
## upstream: https://raw.githubusercontent.com/kepano/flexoki/main/kitty/flexoki_light.conf
## blurb: A high-contrast Flexoki variant for prose and code

# The basic colors
foreground              #100F0F
background              #FFFCF0
selection_foreground    #100F0F
selection_background    #CECDC3

# Cursor colors
cursor                  #100F0F
cursor_text_color       #FFFCF0

# kitty window border colors
active_border_color     #D14D41
inactive_border_color   #CECDC3

# Tab bar colors
active_tab_foreground   #100F0F
active_tab_background   #CECDC3
inactive_tab_foreground #6F6E69
inactive_tab_background #E6E4D9

# The basic 16 colors
# Normal colors meet at least 5.5:1 contrast against the background.
# Bright colors meet at least 7:1 contrast against the background.
# black
color0 #100F0F
color8 #575653

# red
color1  #BA392D
color9  #A12C26

# green
color2  #5F6D28
color10 #4B5E08

# yellow
color3  #7F630D
color11 #6E5301

# blue
color4  #356B99
color12 #1E579A

# magenta
color5  #B33676
color13 #982D6A

# cyan
color6  #27726C
color14 #1B615B

# white
# Dark neutrals keep ANSI white text legible on the light background.
color7  #686763
color15 #403E3C
