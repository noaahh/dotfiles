onboarding = false
[theme]
name = "vesper"

auto_switch = true
dark_name = "one-dark"
light_name = "one-light"
[terminal]
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
last_pane = "prefix+tab"
switch_workspace = "alt+1..9"
previous_tab = "alt+shift+tab"
next_tab = "alt+tab"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "zsh"
width = "94%"
height = "92%"
description = "popup shell"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr.omnisearch.open-live"
description = "OmniSearch: live workspaces and panes"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr.omnisearch.open-archive"
description = "OmniSearch: archived conversations"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open"
description = "shepherd"

[[keys.command]]
key = "alt+a"
type = "shell"
command = "~/.config/herdr/next-pending.sh"
description = "focus next pending agent"

[ui]
sidebar_width = 28
mouse_capture = true
confirm_close = true
prompt_new_workspace_name = true

pane_borders = "always"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status", { token = "$mem", rules = [{ gt = 85, fg = "#dc322f", bold = true }, { gt = 70, fg = "#b58900" }] }]]

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", { token = "machine", fg = "#b58900", rules = [{ equals = "Local", hide = true }] }, "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", { token = "machine", fg = "#b58900", rules = [{ equals = "Local", hide = true }] }, "workspace", "tab"], [{ token = "terminal_title_stripped", dim = true }]]
codex = [["state_icon", { token = "machine", fg = "#b58900", rules = [{ equals = "Local", hide = true }] }, "workspace", "tab"], [{ token = "terminal_title_stripped", dim = true }]]

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

# BEGIN jhochenbaum.hunkdiff — managed by `setup-keys`; edit via the plugin, not by hand
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"
# END jhochenbaum.hunkdiff
