onboarding = false
[theme]
name = "vesper"

auto_switch = false
[terminal]
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
previous_tab = "prefix+left"
next_tab = "prefix+right"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open"
description = "shepherd"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "file viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "file viewer tab"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "toggle floating shell"

[[keys.command]]
key = "alt+a"
type = "shell"
command = "~/.config/herdr/next-pending.sh"
description = "focus next pending agent"

[[keys.command]]
key = "alt+shift+a"
type = "pane"
command = "~/.config/herdr/agent-switcher.sh"
description = "pick agent"

[ui]
sidebar_width = 28
mouse_capture = true
confirm_close = true
agent_panel_scope = "all"

show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
[ui.toast]
delivery = "off"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
