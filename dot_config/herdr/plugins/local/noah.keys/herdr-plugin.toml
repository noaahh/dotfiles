id = "noah.keys"
name = "Keys"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Searchable cheat sheet of every herdr keybinding: built-ins, your overrides, custom commands, and unbound plugin actions"
platforms = ["macos", "linux"]

[[actions]]
id = "show"
title = "Keys: show all keybindings"
command = ["herdr", "plugin", "pane", "open", "--plugin", "noah.keys", "--entrypoint", "sheet"]

[[panes]]
id = "sheet"
title = "Keybindings"
placement = "popup"
width = "90%"
height = "85%"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/keys.py\""]
