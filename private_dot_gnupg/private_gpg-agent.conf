# pinentry-mac shows a native dialog, so gpg and gopass also work from shells
# without a terminal (Claude Code, `!` commands, GUI apps). pinentry-curses
# fails there. Keychain saving is off (org.gpgtools.common DisableKeychain),
# so the passphrase lives only in the agent cache below.
pinentry-program /opt/homebrew/bin/pinentry-mac

# Forget the passphrase 10 minutes after last use, 2 hours at most.
default-cache-ttl 600
max-cache-ttl 7200
