onboarding = false
[theme]
name = "vesper"

auto_switch = true
dark_name = "one-dark"
light_name = "one-light"
[terminal]
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
last_pane = "prefix+tab"
cycle_pane_next = ""  # freed prefix+tab for last_pane
swap_pane_left = "prefix+alt+h"  # prefix+shift+h belongs to hunk review
switch_workspace = "alt+1..9"
previous_tab = "alt+shift+tab"
next_tab = "alt+tab"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"
next_agent = "alt+a"
previous_agent = "alt+shift+a"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "zsh"
width = "94%"
height = "92%"
description = "popup shell"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr.omnisearch.open-live"
description = "OmniSearch: live workspaces and panes"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr.omnisearch.open-archive"
description = "OmniSearch: archived conversations"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open"
description = "shepherd"

[[keys.command]]
key = "prefix+n"
type = "plugin_action"
command = "noah.watch.toggle"
description = "watch: notify once when this agent finishes"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "noah.watch.toggle-sticky"
description = "watch: notify every time this agent finishes"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "noah.tidy.tidy"
description = "tidy: close stale agent panes"

[ui]
mouse_capture = true
confirm_close = true
prompt_new_workspace_name = true
agent_panel_sort = "priority"
sidebar_width = 34
[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

# Task title first; context dimmed below. Machine hidden when Local,
# state text shown only when blocked. $watch, $wake and $mon come from noah.watch, $age from noah.tidy.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true, dim = false }, "$watch"],
  [
    { token = "state_text", fg = "#e5484d", bold = true, rules = [{ equals = "blocked" }, { contains = "", hide = true }] },
    { token = "$wake", fg = "#d19a66" },
    { token = "$mon", fg = "#56b6c2" },
    { token = "$age", dim = true },
    { token = "machine", dim = true, rules = [{ equals = "Local", hide = true }] },
    { token = "workspace", dim = true, bold = false },
    { token = "tab", dim = true },
  ],
]

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

# BEGIN jhochenbaum.hunkdiff — managed by `setup-keys`; edit via the plugin, not by hand
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"
# END jhochenbaum.hunkdiff
