onboarding = false
[theme]
name = "solarized-light"

auto_switch = false
dark_name = "one-dark"
light_name = "one-light"
[terminal]
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
last_pane = "prefix+tab"
switch_workspace = "alt+1..9"
previous_tab = "alt+shift+tab"
next_tab = "alt+tab"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "zsh"
width = "94%"
height = "92%"
description = "popup shell (native floax candidate)"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open"
description = "shepherd"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "file viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "file viewer tab"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "toggle floating shell"

[[keys.command]]
key = "alt+a"
type = "shell"
command = "~/.config/herdr/next-pending.sh"
description = "focus next pending agent"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[ui]
sidebar_width = 28
mouse_capture = true
confirm_close = true
prompt_new_workspace_name = true

show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], [{ token = "terminal_title_stripped", dim = true }]]
codex = [["state_icon", "workspace", "tab"], [{ token = "terminal_title_stripped", dim = true }]]

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

# BEGIN jhochenbaum.hunkdiff — managed by `setup-keys`; edit via the plugin, not by hand
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"
# END jhochenbaum.hunkdiff
