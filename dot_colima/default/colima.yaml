cpu: 6
disk: 100
memory: 12
arch: aarch64
runtime: docker
modelRunner: docker
hostname: colima
kubernetes:
  enabled: false
  version: v1.35.0+k3s1
  k3sArgs:
    - --disable=traefik
  port: 0
autoActivate: true
network:
  address: false
  mode: shared
  interface: en0
  preferredRoute: false
  dns: []
  dnsHosts: {}
  hostAddresses: false
  gatewayAddress: 192.168.5.2
forwardAgent: false
docker:
  features:
    buildkit: true
  builder:
    gc:
      enabled: true
      defaultKeepStorage: "20GB"
  max-concurrent-downloads: 10
  max-concurrent-uploads: 10
vmType: vz
portForwarder: ssh
rosetta: true
binfmt: true
nestedVirtualization: false
mountType: virtiofs
mountInotify: true
cpuType: ""
provision: []
sshConfig: true
sshPort: 0
mounts: []
diskImage: ""
rootDisk: 20
env: {}
